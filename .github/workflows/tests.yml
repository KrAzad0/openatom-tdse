name: tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install -e ".[dev]"
      - run: python -m pytest -q
      - run: python examples/hydrogen_spectrum.py
      - run: python examples/softcore_pulse.py
      - run: python examples/torus_two_state.py
      - run: python examples/torus_six_state.py --output /tmp/torus-study
      - run: python examples/plot_torus_study.py /tmp/torus-study/pulse_full_observables.csv --output /tmp/torus-plots
